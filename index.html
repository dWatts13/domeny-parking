<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domena na sprzedaż</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --border: rgba(255,255,255,0.07);
  --accent: #00e5a0;
  --accent2: #0055ff;
  --text: #f0f0f0;
  --muted: #888;
  --tag-bg: rgba(0,229,160,0.08);
  --tag-border: rgba(0,229,160,0.25);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  position: relative;
  overflow-x: hidden;
}

/* subtle background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* glow blob */
body::after {
  content: '';
  position: fixed;
  top: -20%;
  right: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(0,85,255,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.container {
  max-width: 680px;
  width: 100%;
  position: relative;
  z-index: 1;
}

/* top badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--tag-bg);
  border: 1px solid var(--tag-border);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 2rem;
  animation: fadeDown 0.6s ease both;
}

.badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* domain name */
.domain-name {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2.2rem, 7vw, 4rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-bottom: 1.5rem;
  animation: fadeDown 0.6s 0.1s ease both;
}

.domain-name span {
  color: var(--accent);
}

/* card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2rem;
  margin-bottom: 1rem;
  animation: fadeUp 0.6s 0.2s ease both;
}

.card-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.price-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 0.4rem;
  font-family: 'Syne', sans-serif;
}

.price {
  font-family: 'Syne', sans-serif;
  font-size: 2.4rem;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}

.price sub {
  font-size: 1rem;
  font-weight: 400;
  color: var(--muted);
  vertical-align: baseline;
}

.negotiable-tag {
  display: inline-block;
  background: rgba(0,85,255,0.1);
  border: 1px solid rgba(0,85,255,0.3);
  color: #6699ff;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 100px;
  font-family: 'Syne', sans-serif;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 8px;
}

.fixed-tag {
  display: inline-block;
  background: rgba(0,229,160,0.08);
  border: 1px solid rgba(0,229,160,0.25);
  color: var(--accent);
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 100px;
  font-family: 'Syne', sans-serif;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 8px;
}

.divider {
  width: 1px;
  height: 60px;
  background: var(--border);
}

.meta {
  text-align: right;
}

.meta-item {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
}

.meta-item strong {
  color: var(--text);
  font-weight: 500;
}

/* contact button */
.cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 1rem 2rem;
  background: var(--accent);
  color: #000;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
  animation: fadeUp 0.6s 0.3s ease both;
  margin-bottom: 1rem;
}

.cta:hover {
  background: #00ffb3;
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0,229,160,0.3);
}

.cta svg { flex-shrink: 0; }

/* info strip */
.info-strip {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeUp 0.6s 0.4s ease both;
}

.info-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}

.info-pill::before {
  content: '✓';
  color: var(--accent);
  font-weight: 700;
}

/* footer */
.footer {
  margin-top: 3rem;
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  text-align: center;
  animation: fadeUp 0.6s 0.5s ease both;
  font-family: 'Syne', sans-serif;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* animations */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* domain switcher */
.switcher {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 2rem;
  animation: fadeDown 0.6s 0.05s ease both;
}

.sw-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.03em;
}

.sw-btn:hover, .sw-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--tag-bg);
}
</style>
</head>
<body>

<div class="container">

  <div class="badge">Domena na sprzedaż</div>

  <div class="switcher" id="switcher"></div>

  <div class="domain-name" id="domainDisplay"></div>

  <div class="card">
    <div class="card-row">
      <div>
        <div class="price-label">Cena sprzedaży</div>
        <div class="price" id="priceDisplay"></div>
        <div id="priceTag"></div>
      </div>
      <div class="divider"></div>
      <div class="meta">
        <div class="meta-item">Rozszerzenie: <strong>.pl</strong></div>
        <div class="meta-item">Transfer: <strong>bezpłatny</strong></div>
        <div class="meta-item">Dostępność: <strong>od zaraz</strong></div>
      </div>
    </div>
  </div>

  <a class="cta" id="ctaLink" href="#">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    Napisz do właściciela
  </a>

  <div class="info-strip">
    <span class="info-pill">Szybki transfer</span>
    <span class="info-pill">Bezpieczna transakcja</span>
    <span class="info-pill">Odpowiedź w 24h</span>
  </div>

  <div class="footer">Własność prywatna · Wszelkie prawa zastrzeżone</div>

</div>

<script>
const domains = [
  { name: 'ecomontaz.pl',        price: '1 500 zł', negotiable: false },
  { name: 'technikachlodu.pl',   price: '1 200 zł', negotiable: false },
  { name: 'ecodomkwidzyn.pl',    price: '1 200 zł', negotiable: true  },
  { name: 'technicznikwidzyn.pl',price: '1 000 zł', negotiable: true  },
  { name: 'polskaklima.pl',      price: '1 200 zł', negotiable: true  },
];

const email = 'osial13daniel@gmail.com';
let current = 0;

function render(i) {
  const d = domains[i];
  const parts = d.name.split('.');
  document.getElementById('domainDisplay').innerHTML = parts[0] + '<span>.' + parts[1] + '</span>';
  document.getElementById('priceDisplay').innerHTML = d.price + ' <sub>netto</sub>';
  document.getElementById('priceTag').innerHTML = d.negotiable
    ? '<span class="negotiable-tag">Cena do negocjacji</span>'
    : '<span class="fixed-tag">Cena ostateczna</span>';
  document.getElementById('ctaLink').href = `mailto:${email}?subject=Zapytanie o domenę ${d.name}&body=Dzień dobry,%0A%0AJestem zainteresowany/a zakupem domeny ${d.name}.%0A%0AProszę o kontakt w celu ustalenia szczegółów transakcji.%0A%0APozdrawiam`;
  document.querySelectorAll('.sw-btn').forEach((b, j) => b.classList.toggle('active', j === i));
}

const switcher = document.getElementById('switcher');
domains.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'sw-btn' + (i === 0 ? ' active' : '');
  btn.textContent = d.name;
  btn.onclick = () => { current = i; render(i); };
  switcher.appendChild(btn);
});

render(0);
</script>
</body>
</html>
